version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.11-management
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 5s
      timeout: 5s
      retries: 10

  test-runner:
    image: python:3.11-slim
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./:/work
    working_dir: /work
    command: ["/bin/sh", "-c", "pip install -r integratie/requirements.txt || true; pytest -q integratie/tests/test_identity_rpc_integration.py"]
    environment:
      RABBIT_HOST: rabbitmq
      RABBIT_USER: guest
      RABBIT_PASS: guest
      RABBIT_VHOST: /

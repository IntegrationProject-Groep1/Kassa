name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"] # Moet exact overeenkomen met de `name:` in pipeline.yml
    types:
      - completed

jobs:
  build-and-push:
    name: Build and Push Docker Image
    # Alleen uitvoeren als de CI Pipeline geslaagd is ÉN het om prod of een release tag gaat
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.head_branch == 'prod' ||
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Forceer repository naam naar lowercase voor Docker (GHCR vereist dit)
      - name: Lowercase repo name
        id: repo_name
        run: |
          echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Geef automatisch tags op basis van de repository naam en de git tag/branch
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.ref_name }}

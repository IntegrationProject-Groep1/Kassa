name: CI/CD Pipeline

on:
  push:
    tags:
      - 'v*' # Trigger bij een nieuwe release tag (bijv. v1.0.1)
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r integratie/requirements-dev.txt
          pip install pytest

      - name: Linting
        run: flake8 integratie/

      - name: Type Checking
        run: mypy integratie/

      - name: Unit Tests
        run: pytest integratie/tests/ -v

  build-and-push:
    name: Build and Push Docker Image
    needs: [test] # Wacht tot alle tests geslaagd zijn
    # Alleen uitvoeren bij een push naar prod of een release tag — NIET bij PRs of dev
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Forceer repository naam naar lowercase voor Docker (GHCR vereist dit)
      - name: Lowercase repo name
        id: repo_name
        run: |
          echo "value=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Tags op basis van repository naam en de git tag/branch
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.value }}:latest
            ghcr.io/${{ steps.repo_name.outputs.value }}:${{ github.ref_name }}

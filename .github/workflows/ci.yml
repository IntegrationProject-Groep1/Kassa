name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Least-privilege: jobs get read-only access by default.
# Any job that needs write access must declare it explicitly.
permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r integratie/requirements-dev.txt
          pip install pytest

      - name: Linting
        run: flake8 integratie/ --max-line-length=120

      - name: Type Checking
        run: mypy --config-file=mypy.ini -p integratie

      - name: Unit Tests
        run: pytest integratie/tests/ -v

  integration:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'odoo_test' }}
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'odoo_test_pwd' }}
      ODOO_MASTER_PASS: ${{ secrets.CI_ODOO_MASTER_PASS || 'admin_test' }}
      ODOO_DB: odoo_kassa
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Odoo Config
        run: |
          sed "s/<your_odoo_master_password>/${ODOO_MASTER_PASS}/" odoo.conf.example > odoo.conf

      - name: Verify Odoo Image
        run: |
          echo "Building Odoo image..."
          docker build -f Dockerfile.odoo -t kassa_odoo_test .
          echo "--- odoo binary location ---"
          docker run --rm --entrypoint="" kassa_odoo_test which odoo 2>&1 || true
          echo "--- odoo version ---"
          docker run --rm --entrypoint="" kassa_odoo_test odoo --version 2>&1 || true
          echo "--- ODOO_RC / entrypoint env ---"
          docker run --rm --entrypoint="" kassa_odoo_test env 2>&1 | grep -E "(ODOO|RC|CONFIG|DATA)" || true
          echo "--- entrypoint.sh first 40 lines ---"
          docker run --rm --entrypoint="" kassa_odoo_test head -40 /entrypoint.sh 2>&1 || true
          echo "✓ Image OK"

      - name: Start Services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build

      - name: Initial Container State
        run: |
          sleep 8
          echo "--- container states ---"
          docker ps -a
          echo "--- kassa_odoo logs (first 8s) ---"
          docker logs kassa_odoo 2>&1 || true
          echo "--- kassa_db logs ---"
          docker logs kassa_db 2>&1 | tail -20 || true

      - name: Wait for Odoo HTTP
        run: |
          echo "Waiting for Odoo at http://localhost:8069/web/health..."
          for i in {1..60}; do
            if curl -sf http://localhost:8069/web/health > /dev/null 2>&1; then
              echo "✓ Odoo is up!"
              exit 0
            fi
            STATUS=$(docker inspect --format='{{.State.Status}}' kassa_odoo 2>/dev/null || echo "missing")
            echo "...attempt $i/60 — container: $STATUS"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "restarting" ]; then
              EXITCODE=$(docker inspect --format='{{.State.ExitCode}}' kassa_odoo 2>/dev/null || echo "?")
              echo "❌ Odoo container is $STATUS (exit code: $EXITCODE)."
              echo "--- docker compose logs (kassa-web) ---"
              docker compose -f docker-compose.yml -f docker-compose.ci.yml logs kassa-web 2>&1 | tail -300
              echo "--- docker logs kassa_odoo ---"
              docker logs kassa_odoo 2>&1 | tail -300
              echo "--- inspect ---"
              docker inspect kassa_odoo --format='OOMKilled={{.State.OOMKilled}} Error={{.State.Error}}'
              exit 1
            fi
            sleep 10
          done
          echo "❌ Odoo did not respond in time."
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs kassa-web 2>&1 | tail -300
          docker logs kassa_odoo 2>&1 | tail -300
          exit 1

      - name: Wait for Integration Service (Healthcheck)
        run: |
          echo "Waiting for kassa_integratie to become healthy..."
          # Increased timeout to 10 minutes (60 * 10s) as Odoo setup can be slow in CI
          for i in {1..60}; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' kassa_integratie)
            if [ "$HEALTH" == "healthy" ]; then
              echo "✓ Service is healthy!"
              exit 0
            fi
            echo "...current status: $HEALTH (waiting 10s, attempt $i/60)"
            sleep 10
          done
          echo "❌ Service did not become healthy in time."
          docker compose logs
          exit 1

      - name: Run Integration Tests (bus + custom fields)
        run: docker exec kassa_integratie python tools/run_integration_tests.py

      - name: Run Identity RPC Integration Tests
        run: |
          docker exec kassa_integratie pip install pytest --quiet
          docker exec kassa_integratie python -m pytest tests/test_identity_rpc_integration.py -v

      - name: Run Bus Integration Tests
        run: |
          docker exec kassa_integratie python -m pytest tests/test_bus_integration.py -v --tb=short

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down

name: CI Pipeline

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r integratie/requirements-dev.txt
          pip install pytest

      - name: Linting
        run: flake8 integratie/ --max-line-length=120

      - name: Type Checking
        run: mypy --config-file=mypy.ini -p integratie

      - name: Unit Tests
        run: pytest integratie/tests/ -v

  integration:
    name: Integration Tests (Docker Compose)
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER || 'odoo_test' }}
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD || 'odoo_test_pwd' }}
      ODOO_MASTER_PASS: admin
      ODOO_DB: odoo_kassa
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Services
        run: docker compose up -d --build

      - name: Wait for Odoo HTTP
        run: |
          echo "Waiting for Odoo at http://localhost:8069/web/health..."
          for i in {1..60}; do
            if curl -sf http://localhost:8069/web/health > /dev/null 2>&1; then
              echo "✓ Odoo is up (attempt $i)!"
              exit 0
            fi
            STATUS=$(docker inspect --format='{{.State.Status}}' kassa_odoo 2>/dev/null || echo "missing")
            echo "...attempt $i/60 — container: $STATUS"
            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "restarting" ]; then
              echo "❌ Odoo container is $STATUS (exit $(docker inspect --format='{{.State.ExitCode}}' kassa_odoo 2>/dev/null)). Logs:"
              docker logs kassa_odoo 2>&1 | tail -300
              exit 1
            fi
            sleep 10
          done
          echo "❌ Odoo did not respond in time. Logs:"
          docker logs kassa_odoo 2>&1 | tail -300
          exit 1

      - name: Wait for Integration Service (Healthcheck)
        run: |
          echo "Waiting for kassa_integratie to become healthy..."
          for i in {1..60}; do
            HEALTH=$(docker inspect --format='{{.State.Health.Status}}' kassa_integratie)
            if [ "$HEALTH" == "healthy" ]; then
              echo "✓ Service is healthy!"
              exit 0
            fi
            echo "...current status: $HEALTH (waiting 10s, attempt $i/60)"
            sleep 10
          done
          echo "❌ Service did not become healthy in time."
          docker compose logs
          exit 1

      - name: Run Integration Tests (bus + custom fields)
        run: docker exec kassa_integratie python tools/run_integration_tests.py

      - name: Run Identity RPC Integration Tests
        run: |
          docker exec kassa_integratie pip install pytest --quiet
          docker exec kassa_integratie python -m pytest tests/test_identity_rpc_integration.py -v

      - name: Run Bus Integration Tests
        run: |
          docker exec kassa_integratie python -m pytest tests/test_bus_integration.py -v --tb=short

      - name: Cleanup
        if: always()
        run: docker compose down

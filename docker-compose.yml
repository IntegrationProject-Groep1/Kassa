services:
  kassa-web:
    image: odoo:latest
    depends_on:
      - kassa-db
    container_name: kassa_odoo
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    environment:
      - HOST=kassa-db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
 
  kassa-db:
    image: postgres:15
    container_name: kassa_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql/data

  kassa-integratie:
    build: .
    container_name: kassa_integratie
    environment:
      - ODOO_URL=${ODOO_URL}
      - ODOO_DB=${ODOO_DB}
      - ODOO_USER=${ODOO_USER}
      - ODOO_PASS=${ODOO_PASS}
      - RABBITMQKASSA_HOST=${RABBIT_HOST}
      - RABBITMQKASSA_PORT=${RABBIT_PORT}
      - RABBITMQKASSA_USER=${RABBIT_USER}
      - RABBITMQKASSA_PASS=${RABBIT_PASS}
      - RABBIT_VHOST=${RABBIT_VHOST}
      - RABBIT_AUTO_SETUP_TOPOLOGY=${RABBIT_AUTO_SETUP_TOPOLOGY}
      - RABBIT_EXCHANGE=${RABBIT_EXCHANGE}
      - RABBIT_INCOMING_QUEUE=${RABBIT_INCOMING_QUEUE}
      - POLL_INTERVAL=${POLL_INTERVAL}
      - ODOO_MASTER_PASS=${ODOO_MASTER_PASS}
    volumes:
      - ./integratie:/app
      - outbox-data:/app/outbox
    depends_on:
      - kassa-web
    restart: unless-stopped

volumes:
  outbox-data:
  db-data:
  odoo-data:
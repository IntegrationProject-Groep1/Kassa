services:
  kassa-web:
    image: ${ODOO_IMAGE:-odoo:17.0}
    depends_on:
      - kassa-db
    container_name: kassa_odoo
    restart: unless-stopped
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - odoo-data:/var/lib/odoo
    environment:
      - HOST=kassa-db
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}

  kassa-db:
    image: postgres:15
    container_name: kassa_db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql/data

  kassa-integratie:
    build: .
    container_name: kassa_integratie
    environment:
      - ODOO_URL=${ODOO_URL:-http://kassa-web:8069}
      - ODOO_DB=${ODOO_DB:-odoo_kassa}
      - ODOO_USER=${ODOO_USER:-odoo}
      - ODOO_PASS=${ODOO_PASS:-myodoo}
      - RABBIT_HOST=${RABBIT_HOST:-rabbitmq}
      - RABBIT_PORT=${RABBIT_PORT:-5672}
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASS=${RABBIT_PASS:-guest}
      - RABBIT_VHOST=${RABBIT_VHOST:-/}
      - RABBIT_EXCHANGE=${RABBIT_EXCHANGE:-kassa.exchange}
      - RABBIT_INCOMING_QUEUE=${RABBIT_INCOMING_QUEUE:-kassa.incoming}
      - RABBIT_DLX=${RABBIT_DLX:-kassa.exchange}
      - RABBIT_DLQ=${RABBIT_DLQ:-kassa.incoming.dlq}
      - POLL_INTERVAL=${POLL_INTERVAL:-3}
      - ODOO_MASTER_PASS=${ODOO_MASTER_PASS:-admin}
    volumes:
      - ./integratie:/app
      - outbox-data:/app/outbox
    depends_on:
      kassa-web:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kassa_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  outbox-data:
  db-data:
  odoo-data:
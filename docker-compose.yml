services:
  kassa-web:
    build:
      context: .
      dockerfile: Dockerfile.odoo
    depends_on:
      kassa-db:
        condition: service_healthy
    container_name: kassa_odoo
    command: ["odoo", "--admin_passwd", "${ODOO_MASTER_PASS:-admin}"]
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    environment:
      - HOST=kassa-db
      - PORT=5432
      - USER=${POSTGRES_USER}
      - PASSWORD=${POSTGRES_PASSWORD}
      - RABBIT_HOST=${RABBIT_HOST:-rabbitmq}
      - RABBIT_PORT=${RABBIT_PORT:-5672}
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASS=${RABBIT_PASS:-guest}
      - RABBIT_VHOST=${RABBIT_VHOST:-/}
      - RABBIT_EXCHANGE=${RABBIT_EXCHANGE:-kassa.exchange}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 10

  kassa-db:
    image: postgres:15
    container_name: kassa_db
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kassa-integratie:
    build: .
    container_name: kassa_integratie
    environment:
      - ODOO_URL=${ODOO_URL:-http://kassa-web:8069}
      - ODOO_DB=${ODOO_DB:-odoo_kassa}
      - ODOO_USER=${ODOO_USER:-odoo}
      - ODOO_PASS=${ODOO_PASS:-myodoo}
      - ODOO_MASTER_PASS=${ODOO_MASTER_PASS:-admin}
      - RABBIT_HOST=${RABBIT_HOST:-rabbitmq}
      - RABBIT_PORT=${RABBIT_PORT:-5672}
      - RABBIT_USER=${RABBIT_USER:-guest}
      - RABBIT_PASS=${RABBIT_PASS:-guest}
      - RABBIT_VHOST=${RABBIT_VHOST:-/}
      - RABBIT_EXCHANGE=${RABBIT_EXCHANGE:-kassa.exchange}
      - RABBIT_INCOMING_QUEUE=${RABBIT_INCOMING_QUEUE:-kassa.incoming}
      - RABBIT_DLX=${RABBIT_DLX:-kassa.exchange}
      - RABBIT_DLQ=${RABBIT_DLQ:-kassa.incoming.dlq}
      - POLL_INTERVAL=${POLL_INTERVAL:-3}
    volumes:
      - ./integratie:/app
      - outbox-data:/app/outbox
    depends_on:
      kassa-web:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  kassa-mcp:
    build: .
    container_name: kassa_mcp
    command: python mcp_server.py
    environment:
      - ODOO_URL=${ODOO_URL:-http://kassa-web:8069}
      - ODOO_DB=${ODOO_DB:-odoo_kassa}
      - ODOO_USER=${ODOO_USER:-odoo}
      - ODOO_PASS=${ODOO_PASS:-myodoo}
      - PORT=${MCP_PORT:-8004}
    ports:
      - "${MCP_EXTERNAL_PORT:-30031}:${MCP_PORT:-8004}"
    volumes:
      - ./integratie:/app
    depends_on:
      kassa-web:
        condition: service_started

  rabbitmq:
    image: rabbitmq:3-management
    container_name: kassa_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  outbox-data:
  db-data:
  odoo-data:
